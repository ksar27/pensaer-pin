<style>
/* Layout: an iOS-style app shell. Translucent nav bar, large titles, inset grouped lists, bottom tab bar.
   Sheets rise from the bottom on phones and dock right on desktop. Monochrome ink; colour only for status. */
:root{
  --bg:#F2F2F0; --cell:#FFFFFF; --ink:#111110; --ink2:#6D6D70; --ink3:#A3A3A6; --sep:rgba(60,60,58,.16);
  --fill:rgba(118,118,114,.12); --fill2:rgba(118,118,114,.2); --tint:#111110; --tint-ink:#FFFFFF; --bar:rgba(249,249,247,.84);
  --st-open:#D4432D; --st-notified:#C4830C; --st-fixed:#5B57D6; --st-closed:#2F9B5C; --danger:#D4432D;
  --canvas:#E9E9E6; --grid:rgba(17,17,16,.045); --overlay:rgba(0,0,0,.32); --shadow:0 8px 28px rgba(0,0,0,.12);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --fd:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --fm:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#000000; --cell:#1C1C1E; --ink:#F5F5F3; --ink2:#98989D; --ink3:#5E5E62; --sep:rgba(84,84,88,.6);
  --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.34); --tint:#F5F5F3; --tint-ink:#000000; --bar:rgba(22,22,24,.82);
  --st-open:#FF6B57; --st-notified:#F0A93B; --st-fixed:#8E8BFF; --st-closed:#45C77A; --danger:#FF6B57;
  --canvas:#111112; --grid:rgba(255,255,255,.05); --overlay:rgba(0,0,0,.55); --shadow:0 8px 28px rgba(0,0,0,.6); color-scheme:dark}
  .logo{filter:invert(1)}}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.35 var(--f);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
[hidden]{display:none!important}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.st-open{--pc:var(--st-open)} .st-notified{--pc:var(--st-notified)} .st-fixed{--pc:var(--st-fixed)} .st-closed{--pc:var(--st-closed)}

.app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.nav{position:relative;z-index:6;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:50px;padding:4px 8px;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep);flex:none}
.nav.clear{border-bottom-color:transparent;background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none}
.nav-l{display:flex;align-items:center;min-width:0}
.nav-r{display:flex;align-items:center;justify-content:flex-end;gap:2px}
.nav-t{font-weight:600;font-size:17px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.tbtn{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--tint);font-size:17px;padding:8px;border-radius:10px;white-space:nowrap}
.tbtn:hover{background:var(--fill)}
.tbtn.b{font-weight:600}
.tbtn:disabled{color:var(--ink3)}
.tbtn .ic{width:24px;height:24px}
.back .ic{width:26px;height:26px;margin-left:-6px;stroke-width:2}
.scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:720px;margin:0 auto;padding:4px 16px 120px}
.wrap.wide{max-width:1040px}
.large{font:700 34px/1.12 var(--fd);letter-spacing:-.025em;margin:6px 4px 18px;text-wrap:balance}
.logo{display:block;height:30px;width:auto}
.logo.lg{height:58px}
.badge{display:block;width:34px;height:34px;border-radius:50%}
.badge.lg{width:76px;height:76px}
@media (prefers-color-scheme: dark){.badge{box-shadow:0 0 0 1px rgba(255,255,255,.16)}}
.group-h{font-size:13px;color:var(--ink2);text-transform:uppercase;letter-spacing:.01em;margin:0 16px 7px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.group-h button{border:0;background:none;color:var(--tint);font-size:15px;text-transform:none;padding:0}
.group{background:var(--cell);border-radius:12px;overflow:hidden;margin:0 0 30px}
.group-f{font-size:13px;color:var(--ink2);margin:-23px 16px 30px;line-height:1.4}
.cell{display:flex;align-items:center;gap:12px;min-height:46px;padding:10px 16px;position:relative;background:none;border:0;width:100%;text-align:left;color:var(--ink)}
.cell+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
button.cell:active{background:var(--fill)}
@media (hover:hover){button.cell:hover{background:color-mix(in srgb,var(--fill) 50%,transparent)}}
.cl{flex:none}
.cv{flex:1;min-width:0;text-align:right;color:var(--ink2);border:0;background:none;outline:none;padding:0;font-size:17px}
.cv::placeholder{color:var(--ink3)}
select.cv{appearance:none;-webkit-appearance:none;text-align-last:right;cursor:pointer}
.cfull{flex:1;min-width:0;border:0;background:none;outline:none;padding:0;font-size:17px;color:var(--ink)}
.cfull::placeholder{color:var(--ink3)}
textarea.cfull{resize:vertical;min-height:70px;line-height:1.4}
.chev{color:var(--ink3);width:18px;height:18px;stroke-width:2.2;flex:none}
.sub{display:block;font-size:14px;color:var(--ink2);margin-top:1px}
.grow{flex:1;min-width:0}
.trail{color:var(--ink2);font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cell.center{justify-content:center;color:var(--tint)}
.cell.danger{justify-content:center;color:var(--danger)}
.cell.primary{justify-content:center;background:var(--tint);color:var(--tint-ink);font-weight:600}
.cell .chk{width:20px;height:20px;color:var(--tint);stroke-width:2.4;margin-left:auto}
.dot{width:10px;height:10px;border-radius:50%;background:var(--pc);flex:none}
.ref{font:500 14px/1 var(--fm);color:var(--ink2);letter-spacing:0}
.late{color:var(--st-open)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 7px;border-radius:6px;background:color-mix(in srgb,var(--pc,var(--ink2)) 14%,transparent);color:var(--pc,var(--ink2))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:13px 20px;background:var(--tint);color:var(--tint-ink);font-weight:600;font-size:17px}
.btn.sec{background:var(--fill);color:var(--ink)}
.btn.sm{padding:7px 13px;font-size:15px;border-radius:999px}
.btn:disabled{opacity:.45}
.switch{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:999px;background:var(--fill2);position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.switch:checked{background:var(--st-closed)}
.switch:checked::after{transform:translateX(20px)}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:0}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:6px 4px;font-size:13.5px;font-weight:500;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:5px;min-width:0;white-space:nowrap}
.seg button.on{background:var(--cell);box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04);font-weight:600}
@media (prefers-color-scheme: dark){.seg button.on{background:#636366}}
.seg.status button.on{color:var(--pc)}
.seg.status button::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pc);flex:none}
.seg:has(button:disabled){opacity:.7}
.bar4{display:flex;height:4px;border-radius:999px;overflow:hidden;background:var(--fill);margin-top:8px;max-width:240px}
.bar4 span{background:var(--pc)}
.center-msg{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--ink2);text-align:center;padding:12vh 24px 0}
.center-msg h2{font:600 22px/1.2 var(--fd);color:var(--ink);margin:0;letter-spacing:-.015em}
.center-msg p{margin:0;max-width:36ch}
.center-msg .actions{display:flex;flex-direction:column;gap:10px;margin-top:14px;width:100%;max-width:300px}
.spinner{width:24px;height:24px;border:2.5px solid var(--fill2);border-top-color:var(--ink2);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Sign in */
.signin{max-width:380px;margin:0 auto;padding:12vh 24px 40px;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
.signin h1{font:600 20px/1.25 var(--fd);margin:0;letter-spacing:-.015em}
.signin p{color:var(--ink2);margin:6px 0 0}
.signin form{width:100%;display:flex;flex-direction:column;gap:12px}
.signin .fields{background:var(--cell);border-radius:12px;overflow:hidden;text-align:left}
.signin .fields input{display:block;width:100%;border:0;background:none;padding:14px 16px;outline:none;font-size:17px}
.signin .fields input+input{border-top:.5px solid var(--sep)}
.err{color:var(--danger);font-size:14px;margin:0}

/* Project shell */
.pmain{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.pmain.scroll{display:block}
.tabbar{display:flex;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);flex:none;padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px 6px;border:0;background:none;color:var(--ink3);font-size:10.5px;font-weight:500;letter-spacing:0}
.tab .ic{width:26px;height:26px;stroke-width:1.6}
.tab.on{color:var(--tint)}

/* Drawings */
.planpick{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;scrollbar-width:none;flex:none;background:var(--bar);border-bottom:.5px solid var(--sep)}
.capsule{border:0;background:var(--fill);color:var(--ink);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:500;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.capsule.on{background:var(--tint);color:var(--tint-ink)}
.capsule .n{opacity:.6;font-size:13px;font-variant-numeric:tabular-nums}
.viewer{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;background-color:var(--canvas);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;user-select:none;-webkit-user-select:none}
.viewer.placing{cursor:crosshair}
.stage{position:absolute;left:0;top:0;transform-origin:0 0}
.stage img{display:block;width:100%;height:100%;max-width:none;pointer-events:none;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08),0 10px 30px rgba(0,0,0,.08)}
.pins{position:absolute;inset:0}
.pin{position:absolute;width:28px;height:34px;padding:0;border:0;background:none;transform:translate(-50%,-100%) scale(var(--inv,1));transform-origin:50% 100%}
.pin::before{content:"";position:absolute;left:50%;top:0;width:26px;height:26px;margin-left:-13px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--pc);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.pin b{position:absolute;left:0;right:0;top:7px;font:600 10.5px/1 var(--f);color:#fff;text-align:center}
.pin.draft{--pc:var(--tint)} .pin.draft b{color:var(--tint-ink)}
.pin.dim{opacity:.5}
.float{position:absolute;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:var(--shadow);border:.5px solid var(--sep)}
.zoom{right:12px;top:12px;border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
.zoom button{width:44px;height:42px;border:0;background:none;display:grid;place-items:center;color:var(--ink)}
.zoom button+button{border-top:.5px solid var(--sep)}
.zoom .ic{width:20px;height:20px}
.closedtg{left:12px;top:12px;border-radius:999px;display:flex;align-items:center;gap:8px;padding:5px 6px 5px 13px;font-size:14px;font-weight:500}
.closedtg .switch{transform:scale(.8);margin:-3px -4px}
.hint{left:50%;top:14px;transform:translateX(-50%);border-radius:999px;padding:9px 16px;font-size:15px;font-weight:500;white-space:nowrap}
.addbtn{position:absolute;right:16px;bottom:18px;width:58px;height:58px;border-radius:50%;border:0;background:var(--tint);color:var(--tint-ink);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:5}
.addbtn .ic{width:28px;height:28px;stroke-width:2.2;transition:transform .2s}
.addbtn.on .ic{transform:rotate(45deg)}
.addbtn.fixed{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px))}

/* Lists */
.searchbar{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:0 9px;margin:0 0 12px}
.searchbar .ic{width:18px;height:18px;color:var(--ink2)}
.searchbar input{flex:1;border:0;background:none;outline:none;padding:8px 0;font-size:17px;min-width:0}
.listtools{display:flex;gap:10px;align-items:center;margin-bottom:18px}
.listtools .seg{flex:1}
.srow .grow{display:flex;flex-direction:column;gap:2px}
.srt{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srs{font-size:14px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb{width:46px;height:46px;border-radius:8px;overflow:hidden;background:var(--fill);flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.srr{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:13px;color:var(--ink2);white-space:nowrap}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 24px}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.bignum{display:flex;align-items:baseline;gap:8px;padding:14px 16px 4px}
.bignum b{font:700 44px/1 var(--fd);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bignum span{color:var(--ink2);font-size:15px}
.stack{display:flex;height:6px;border-radius:999px;overflow:hidden;background:var(--fill);margin:10px 16px 14px}
.stack span{background:var(--pc)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:0 16px 14px;font-size:13px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .dot{width:8px;height:8px}

/* Trail */
.steps{display:grid;grid-template-columns:repeat(4,1fr);padding:14px 8px 12px}
.step{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;font-size:12px}
.step::before{content:"";position:absolute;top:5px;left:-50%;right:50%;height:2px;background:var(--fill2)}
.step:first-child::before{display:none}
.step.done::before{background:var(--ink)}
.step i{width:12px;height:12px;border-radius:50%;background:var(--fill2);position:relative;z-index:1}
.step.done i{background:var(--ink)}
.step b{font-weight:600}
.step span{color:var(--ink2);font-variant-numeric:tabular-nums}
.entry{display:flex;gap:12px;padding:11px 16px;position:relative}
.entry+.entry::before{content:"";position:absolute;top:0;left:48px;right:0;border-top:.5px solid var(--sep)}
.entry .ei{width:20px;color:var(--ink2);flex:none;padding-top:2px}
.entry .ei .ic{width:18px;height:18px}
.entry .et{white-space:pre-wrap;overflow-wrap:anywhere}
.entry.status .et{color:var(--ink2);font-size:15px}
.entry small{display:block;color:var(--ink2);font-size:13px;margin-top:3px}
.entry .eph{display:flex;gap:6px;margin-top:6px}
.entry .eph img{width:56px;height:56px;border-radius:6px;object-fit:cover}
.compose{display:flex;gap:8px;align-items:flex-end;padding:8px 8px 8px 16px}
.compose textarea{flex:1;border:0;background:none;outline:none;min-width:0;font-size:17px;resize:none;min-height:24px;max-height:160px;line-height:1.35}
.round{width:34px;height:34px;border-radius:50%;border:0;background:var(--tint);color:var(--tint-ink);display:grid;place-items:center;flex:none}
.round.ghost{background:var(--fill);color:var(--ink)}
.round.rec{background:var(--danger);color:#fff}
.round .ic{width:17px;height:17px;stroke-width:2.2}
.aibar{display:flex;gap:16px;align-items:center;padding:10px 16px;border-top:.5px solid var(--sep);flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--tint);font-size:15px;padding:0;display:inline-flex;gap:6px;align-items:center}
.linkbtn .ic{width:18px;height:18px}
.linkbtn:disabled{color:var(--ink3)}

/* Sheets */
.sheet-bg{position:fixed;inset:0;background:var(--overlay);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{background:var(--bg);width:100%;max-width:640px;height:calc(100% - 14px - env(safe-area-inset-top,0px));border-radius:12px 12px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:rise .32s cubic-bezier(.2,.9,.25,1);overflow:hidden}
.sheet.short{height:auto;max-height:calc(100% - 14px - env(safe-area-inset-top,0px))}
@media (min-width:900px){.sheet-bg{justify-content:flex-end;align-items:stretch}.sheet,.sheet.short{max-width:480px;height:100%;max-height:none;border-radius:0;animation:slide .28s cubic-bezier(.2,.9,.25,1)}.grabber{display:none}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(100%)}}
@keyframes slide{from{transform:translateX(100%)}}
.grabber{width:36px;height:5px;border-radius:999px;background:var(--fill2);margin:6px auto 0;flex:none}
.sheet .nav{background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none;border-bottom:0}
.sh-body{overflow:auto;padding:6px 16px calc(32px + env(safe-area-inset-bottom,0px));flex:1}
.titlefield{width:100%;border:0;background:none;outline:none;font:700 24px/1.2 var(--fd);letter-spacing:-.02em;color:var(--ink);padding:0;resize:none}
.photos{display:flex;gap:8px;overflow-x:auto;padding:0 0 4px;margin:0 0 30px;scrollbar-width:none}
.ph{flex:none;width:96px;height:96px;border-radius:12px;overflow:hidden;border:0;background:var(--cell);padding:0}
.ph img{width:100%;height:100%;object-fit:cover}
.ph.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink2);font-size:13px;font-weight:500}
.ph.add .ic{width:26px;height:26px;color:var(--tint)}
.loccell canvas{width:56px;height:56px;border-radius:8px;background:#fff;flex:none}
.lb{position:fixed;inset:0;z-index:40;background:#000;color:#fff;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.lb-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 8px}
.lb-top .t{font-weight:600;font-size:16px;text-align:center}
.lb .tbtn{color:#fff}
.lb .tbtn:hover{background:rgba(255,255,255,.12)}
.lb-stage{flex:1;min-height:0;display:grid;place-items:center;padding:8px;position:relative}
.lb-stage img,.lb-stage canvas{max-width:100%;max-height:100%;object-fit:contain;touch-action:none;border-radius:4px}
.lb-bar{display:flex;justify-content:center;gap:10px;padding:12px 10px 14px;flex-wrap:wrap;align-items:center}
.lb-bar .tbtn{flex-direction:column;gap:3px;font-size:12px}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0}
.swatch.on{border-color:#fff}
.tool{border:0;background:rgba(255,255,255,.1);color:#fff;border-radius:8px;padding:6px 10px;font-size:13px}
.tool.on{background:#fff;color:#000}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);color:var(--ink);padding:11px 18px;border-radius:999px;font-size:15px;font-weight:500;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow);border:.5px solid var(--sep);text-align:center}
.busy{position:fixed;inset:0;z-index:70;background:var(--overlay);display:grid;place-items:center}
.busy>div{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-radius:16px;padding:22px 26px;display:flex;flex-direction:column;align-items:center;gap:12px;font-size:15px;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 64px);text-align:center}
.dialog{background:var(--cell);border-radius:16px;padding:22px;max-width:380px;width:calc(100% - 48px);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.dialog h3{margin:0;font:600 18px/1.25 var(--fd)}
.dialog p{margin:0;color:var(--ink2);font-size:15px}
.dialog pre{margin:0;background:var(--fill);border-radius:10px;padding:12px;font:14px/1.5 var(--fm);white-space:pre-wrap;overflow-wrap:anywhere;user-select:all}
.dialog .row{display:flex;gap:10px;justify-content:flex-end}

/* A4 report preview + print */
.preview{position:fixed;inset:0;z-index:50;background:#6b6b6b;display:flex;flex-direction:column}
.preview .nav{background:#2a2a2a;color:#fff;border-bottom:0}
.preview .tbtn{color:#fff}
.preview .scroll{padding:24px 12px 60px}
.page{width:210mm;min-height:297mm;margin:0 auto 18px;background:#fff;color:#121211;box-shadow:0 4px 20px rgba(0,0,0,.35);padding:16mm 15mm 18mm;position:relative;font:9.5pt/1.45 var(--f);letter-spacing:0;transform-origin:top center}
@media (max-width:840px){.page{zoom:calc((100vw - 24px) / 210mm)}}
.rp-head{display:flex;justify-content:space-between;align-items:center;border-bottom:.6pt solid #121211;padding-bottom:3mm;margin-bottom:7mm;font-size:7.5pt;color:#6b6b6d}
.rp-head img{height:5.5mm;width:auto;flex:none}
.rp-cover-logo{height:12mm;width:auto;max-width:none;margin-bottom:53mm;display:block}
.rp-label{font-size:6.5pt;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#6b6b6d}
.rp-title{font:700 26pt/1.1 var(--fd);letter-spacing:-.02em;margin:3mm 0 2mm}
.rp-sub{font-size:14pt;color:#6b6b6d;margin-bottom:9mm}
.rp-issued{background:#f6f6f5;border-radius:1.5mm;padding:4mm 5mm;margin-bottom:9mm}
.rp-issued b{display:block;font-size:11pt;margin-top:1mm}
.rp-issued small{display:block;color:#6b6b6d;margin-top:1mm}
.rp-meta{display:grid;grid-template-columns:1fr 1fr;gap:4mm 8mm;border-top:.6pt solid #121211;border-bottom:.5pt solid #dcdcda;padding:5mm 0 6mm;margin-bottom:9mm}
.rp-meta div span{display:block;font-size:10pt;margin-top:1mm}
.rp-stats{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:6mm}
.rp-stats b{display:block;font:600 24pt/1 var(--fd)}
.rp-stats span{display:flex;align-items:center;gap:2mm;color:#6b6b6d;font-size:8.5pt;margin-top:2mm}
.rp-stats i,.rp-dot{width:2mm;height:2mm;border-radius:50%;background:var(--pp);display:inline-block}
.rp-note{color:#6b6b6d;margin-bottom:9mm}
.rp-table{width:100%;border-collapse:collapse;font-size:9pt}
.rp-table th{font-size:6.5pt;letter-spacing:.09em;text-transform:uppercase;color:#6b6b6d;font-weight:600;text-align:right;border-bottom:.6pt solid #121211;padding:0 0 2mm}
.rp-table th:first-child,.rp-table td:first-child{text-align:left}
.rp-table td{text-align:right;border-bottom:.4pt solid #e2e2e0;padding:2mm 0;font-variant-numeric:tabular-nums}
.rp-table td.z{color:#a3a3a6}
.rp-drawing h2{font:600 13pt/1.2 var(--fd);margin:1mm 0 5mm}
.rp-drawing img{width:100%;border:.5pt solid #dcdcda}
.rp-rec{display:grid;grid-template-columns:15mm 1fr;border-bottom:.5pt solid #dcdcda;padding:0 0 5mm;margin:0 0 5mm;break-inside:avoid;page-break-inside:avoid;position:relative}
.rp-rec::before{content:"";position:absolute;left:-3.5mm;top:.5mm;bottom:6mm;width:.7mm;background:var(--pp)}
.rp-ref{font:600 11pt/1 var(--fm)}
.rp-room{font:500 7.5pt/1.3 var(--fm);color:#6b6b6d;margin-top:1.2mm;word-break:break-all}
.rp-high{font-size:6pt;font-weight:700;letter-spacing:.08em;color:#d4432d;margin-top:2mm}
.rp-rt{display:flex;justify-content:space-between;gap:4mm;align-items:flex-start}
.rp-rt h3{font:600 12pt/1.25 var(--fd);margin:0}
.rp-st{font-size:8.5pt;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:1.6mm}
.rp-facts{display:grid;grid-template-columns:repeat(4,1fr);gap:3mm;margin:3mm 0 1mm}
.rp-facts span{display:block;font-size:9pt;margin-top:.6mm}
.rp-dwg{font-size:8pt;color:#6b6b6d}
.rp-steps{display:grid;grid-template-columns:repeat(4,1fr);margin:4mm 0 4mm}
.rp-steps div{position:relative;padding-top:4mm}
.rp-steps div::before{content:"";position:absolute;top:0;left:0;width:2.2mm;height:2.2mm;border-radius:50%;border:.7pt solid #a3a3a6;box-sizing:border-box}
.rp-steps div::after{content:"";position:absolute;top:1mm;left:3.2mm;right:1mm;height:.6pt;background:#dcdcda}
.rp-steps div:last-child::after{display:none}
.rp-steps div.on::before{background:#121211;border-color:#121211}
.rp-steps div.on-next::after{background:#121211}
.rp-steps b{display:block;font-size:6.5pt;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:#a3a3a6}
.rp-steps div.on b{color:#121211}
.rp-steps span{font:8.5pt var(--fm);color:#a3a3a6}
.rp-steps div.on span{color:#121211}
.rp-p{margin:0 0 3mm;white-space:pre-wrap}
.rp-imgs{display:grid;grid-template-columns:repeat(4,1fr);gap:1.6mm;margin:1mm 0 4mm}
.rp-imgs img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:.5mm;display:block}
.rp-corr{display:grid;grid-template-columns:17mm 24mm 1fr;gap:1.4mm 2mm;font-size:8.5pt;margin-top:1.6mm}
.rp-corr .d{font:8pt var(--fm);color:#6b6b6d}
.rp-corr .k{font-size:8pt;color:#6b6b6d;font-weight:500}
.rp-corr .s{color:#6b6b6d}
.rp-foot{position:absolute;left:15mm;right:15mm;bottom:8mm;display:flex;justify-content:space-between;border-top:.5pt solid #dcdcda;padding-top:2mm;font-size:7.5pt;color:#6b6b6d}
@page{size:A4;margin:0}
@media print{
  html,body{height:auto;overflow:visible;background:#fff}
  body>*:not(#previewRoot){display:none!important}
  .preview{position:static;background:#fff;display:block}
  .preview .nav{display:none}
  .preview .scroll{padding:0;overflow:visible}
  .page{box-shadow:none;margin:0;zoom:1!important;page-break-after:always;break-after:page;min-height:297mm;height:auto}
  .page.flow{page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function toast(msg, ms = 2800){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, ms); }
function busy(msg){ $('#busyText').textContent = msg; $('#busy').hidden = false; }
function unbusy(){ $('#busy').hidden = true; }
const scripts = {};
function loadScript(src){ return scripts[src] ||= new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => { delete scripts[src]; rej(new Error('load')); }; document.head.appendChild(s); }); }
function fail(e, fallback = 'Something went wrong. Try again.'){
  console.warn(e);
  const msg = e?.message || '';
  if (/Failed to fetch|NetworkError/i.test(msg)) return toast("You're offline. Check your connection and try again.", 4000);
  toast(fallback, 4000);
}
async function fnError(error){
  try { const j = await error.context.json(); if (j?.error) return j.error; } catch {}
  return error?.message || 'Something went wrong.';
}

}

/* ---------- Media ---------- */
async function signed(keys){
  const need = [...new Set(keys.filter(k => k && !S.urls.has(k)))];
  for (let i = 0; i < need.length; i += 100){
    const { data } = await sb.storage.from(BUCKET).createSignedUrls(need.slice(i, i + 100), 3600 * 6);
    (data || []).forEach(d => { if (d.signedUrl) S.urls.set(d.path, d.signedUrl); });
  }
  return keys.map(k => S.urls.get(k));
}
async function urlFor(key){ return (await signed([key]))[0]; }
function hydrate(root = document){
  const els = $$('img[data-key]', root).filter(i => i.dataset.done !== i.dataset.key);
  if (!els.length) return;
  signed(els.map(e => e.dataset.key)).then(() => els.forEach(e => { const u = S.urls.get(e.dataset.key); if (u){ e.src = u; e.dataset.done = e.dataset.key; } }));
}
function loadImg(src){ return new Promise((res, rej) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function imageFor(key){
  if (!S.imgs.has(key)) S.imgs.set(key, urlFor(key).then(u => u ? loadImg(u) : null).catch(() => null));
  return S.imgs.get(key);
}
function scaleCanvas(src, max){
  const w = src.naturalWidth || src.width, h = src.naturalHeight || src.height, k = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(src, 0, 0, c.width, c.height); return c;
}
const toBlob = (c, q = .82) => new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('encode')), 'image/jpeg', q));
async function fileToCanvas(file, max){ const u = URL.createObjectURL(file); try { return scaleCanvas(await loadImg(u), max); } finally { URL.revokeObjectURL(u); } }
async function upload(canvas, pid, max = 2000, q = .82){
  const key = `${pid}/${uuid()}.jpg`;
  const blob = await toBlob(scaleCanvas(canvas, max), q);
  const { error } = await sb.storage.from(BUCKET).upload(key, blob, { contentType:'image/jpeg', upsert:true });
  if (error) throw error;
  return key;
}

/* ---------- Pins ---------- */
function drawPin(ctx, x, y, r, label, color){
  ctx.save(); ctx.translate(x, y);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(-r * .4, -r * .9, -r, -r * 1.3, -r, -r * 2); ctx.arc(0, -r * 2, r, Math.PI, 0); ctx.bezierCurveTo(r, -r * 1.3, r * .4, -r * .9, 0, 0); ctx.closePath();
  ctx.fillStyle = color; ctx.strokeStyle = '#fff'; ctx.lineWidth = r * .16; ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = `700 ${Math.round(r * (String(label).length > 2 ? .78 : .95))}px -apple-system, Helvetica, Arial, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(label), 0, -r * 2);
  ctx.restore();
}
function cropPlan(img, fx, fy, label, color, size){
  const w = img.naturalWidth, h = img.naturalHeight, side = Math.max(w, h) * .16;
  const sx = clamp(fx * w - side / 2, 0, Math.max(0, w - side)), sy = clamp(fy * h - side / 2, 0, Math.max(0, h - side));
  const c = document.createElement('canvas'); c.width = c.height = size; const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, size, size); x.drawImage(img, sx, sy, side, side, 0, 0, size, size);
  drawPin(x, (fx * w - sx) / side * size, (fy * h - sy) / side * size, size * .075, label, color); return c;
}

/* ---------- Data ---------- */
async function loadMe(){
  const { data: { user } } = await sb.auth.getUser();
  if (!user){ S.me = null; return; }
  const { data } = await sb.from('profiles').select('role,name,email').eq('user_id', user.id).maybeSingle();
  S.me = { id:user.id, email:user.email, role:data?.role || 'party', name:data?.name || user.user_metadata?.name || '' };
}
async function loadProjects(){
  const { data, error } = await sb.from('projects').select('*').eq('removed', false).order('updated_at', { ascending:false });
  if (error) throw error;
  S.projects = data;
  const { data: sn } = await sb.from('snags').select('project_id,status,due').eq('removed', false);
  S.allStats = {};
  (sn || []).forEach(s => { s.status = normStatus(s.status); (S.allStats[s.project_id] ||= []).push(s); });
}
async function loadProject(pid){
  const [pa, pl, sn, ac] = await Promise.all([
    sb.from('parties').select('*').eq('project_id', pid).eq('removed', false).order('name'),
    sb.from('plans').select('*').eq('project_id', pid).eq('removed', false).order('created_at'),
    sb.from('snags').select('*').eq('project_id', pid).eq('removed', false),
    sb.from('activity').select('*').eq('project_id', pid).order('at'),
  ]);
  for (const r of [pa, pl, sn, ac]) if (r.error) throw r.error;
  if (pid !== S.pid) return;
  S.parties = pa.data; S.plans = pl.data; S.activity = ac.data;
  S.snags = sn.data.map(s => ({ ...s, status: normStatus(s.status), photo_keys: s.photo_keys || [] }));
  S.loaded = true;
  if (!S.plans.find(p => p.id === S.planId)) S.planId = S.plans[0]?.id || null;
}
let refreshT;
function subscribe(){
  if (S.channel) sb.removeChannel(S.channel);
  S.channel = sb.channel('pin-' + uuid()).on('postgres_changes', { event:'*', schema:'public' }, () => {
    clearTimeout(refreshT);
    refreshT = setTimeout(refresh, 600);
  }).subscribe();
}
async function refresh(){
  try {
    if (S.view === 'project' && S.pid){ await loadProject(S.pid); onData(); }
    else if (S.view === 'home'){ await loadProjects(); renderHome(); }
  } catch (e){ console.warn(e); }
}

async function saveSnag(s, patch, logText, kind = 'status'){
  const row = { ...patch, updated_at:nowISO(), updated_by:author() };
  Object.assign(s, row);
  const { error } = await sb.from('snags').update(row).eq('id', s.id);
  if (error) return fail(error, "Couldn't save that change.");
  if (logText) await addEntry(s, logText, kind);
}
async function addEntry(s, text, kind, photos = []){
  const row = { id:uuid(), project_id:s.project_id, snag_id:s.id, text, is_comment:kind !== 'status', by:author(), at:nowISO(), kind, author_email:S.me.email, photo_keys:photos };
  S.activity.push(row);
  const { error } = await sb.from('activity').insert(row);
  if (error) fail(error, "Couldn't add that to the trail.");
}
function moveStatus(s, to){
  const patch = { status:to }, now = nowISO();
  if (to === 'notified'){ if (!s.notified_at) patch.notified_at = now; patch.closed_at = null; }
  if (to === 'fixed'){ patch.fixed_at = now; patch.closed_at = null; }
  if (to === 'closed') patch.closed_at = now;
  if (to === 'open') patch.closed_at = null;
  return patch;
}
async function setStatus(s, to){
  if (s.status === to) return;
  const reopening = s.status === 'closed';
  await saveSnag(s, moveStatus(s, to), `${reopening ? 'Reopened' : 'Status'}: ${STATUS_LONG[to]}`);
}
async function issue(list, party, reference){
  for (const s of list){
    const patch = s.status === 'open' ? moveStatus(s, 'notified') : (s.notified_at ? {} : { notified_at:nowISO() });
    await saveSnag(s, patch, `Issued to ${party.name} in ${reference}`, 'notice');
  }
}

/* ---------- Boot ---------- */
async function boot(){
  const { data } = await sb.auth.getSession();
  S.session = data.session;
  sb.auth.onAuthStateChange((ev, session) => {
    S.session = session;
    if (ev === 'SIGNED_OUT'){ S.me = null; renderSignIn(); }
  });
  if (!S.session) return renderSignIn();
  await start();
}
async function start(){
  $('#app').innerHTML = `<div class="center-msg"><span class="spinner"></span></div>`;
  try {
    await loadMe();
    if (!S.me) return renderSignIn();
    const { data: cfg } = await sb.from('settings').select('practice_name').eq('id', 1).maybeSingle();
    S.practice = cfg?.practice_name || '';
    await loadProjects();
    subscribe();
    S.ready = true;
    const hash = location.hash.slice(1);
    if (hash && S.projects.find(p => p.id === hash)) openProject(hash); else renderHome();
  } catch (e){
    fail(e);
    $('#app').innerHTML = `<div class="center-msg"><h2>Can't reach pin.</h2><p>Check your connection, then reload this page.</p></div>`;
  }
}

function mountViewer(){
  const plan = S.plans.find(p => p.id === S.planId); if (!plan) return;
  const viewer = $('#viewer'), stage = $('#stage'), img = $('#planImg');
  V.w = plan.width || 1600; V.h = plan.height || 1100;
  stage.style.width = V.w + 'px'; stage.style.height = V.h + 'px';
  fitView(); updatePins();
  urlFor(plan.image_key).then(u => { if (u && $('#planImg') === img) img.src = u; });
  viewer.addEventListener('pointerdown', e => {
    if (e.target.closest('.pin,.float,.addbtn')) return;
    viewer.setPointerCapture(e.pointerId); V.ptr.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (V.ptr.size === 1){ V.tap = { t:Date.now(), moved:false }; V.pan = { x:V.x, y:V.y, sx:e.clientX, sy:e.clientY }; }
    else if (V.ptr.size === 2){ V.tap = null; const [a, b] = [...V.ptr.values()], r = viewer.getBoundingClientRect();
      V.pinch = { d:Math.hypot(a.x - b.x, a.y - b.y), s:V.scale, px:((a.x + b.x) / 2 - r.left - V.x) / V.scale, py:((a.y + b.y) / 2 - r.top - V.y) / V.scale }; }
  });
  viewer.addEventListener('pointermove', e => {
    if (!V.ptr.has(e.pointerId)) return; V.ptr.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (V.ptr.size === 1 && V.pan){ const dx = e.clientX - V.pan.sx, dy = e.clientY - V.pan.sy; if (V.tap && Math.hypot(dx, dy) > 6) V.tap.moved = true; V.x = V.pan.x + dx; V.y = V.pan.y + dy; applyT(); }
    else if (V.ptr.size === 2 && V.pinch){ const [a, b] = [...V.ptr.values()], r = viewer.getBoundingClientRect(); const ns = clamp(V.pinch.s * Math.hypot(a.x - b.x, a.y - b.y) / V.pinch.d, V.min, V.max);
      V.scale = ns; V.x = (a.x + b.x) / 2 - r.left - V.pinch.px * ns; V.y = (a.y + b.y) / 2 - r.top - V.pinch.py * ns; applyT(); }
  });
  const end = e => { if (!V.ptr.has(e.pointerId)) return; V.ptr.delete(e.pointerId);
    if (e.type === 'pointerup' && V.tap && !V.tap.moved && Date.now() - V.tap.t < 600 && S.placing) placeAt(e.clientX, e.clientY);
    V.tap = null; V.pinch = null; if (V.ptr.size === 1){ const [p] = [...V.ptr.values()]; V.pan = { x:V.x, y:V.y, sx:p.x, sy:p.y }; } else V.pan = null; };
  viewer.addEventListener('pointerup', end); viewer.addEventListener('pointercancel', end);
  viewer.addEventListener('wheel', e => { e.preventDefault(); const r = viewer.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * .0022), e.clientX - r.left, e.clientY - r.top); }, { passive:false });
}
function applyT(){ const st = $('#stage'); if (!st) return; st.style.transform = `translate(${V.x}px,${V.y}px) scale(${V.scale})`; st.style.setProperty('--inv', (1 / V.scale).toFixed(5)); }
function fitView(){ const vw = $('#viewer'); if (!vw) return; const r = vw.getBoundingClientRect(); if (!r.width) return;
  const s = Math.min((r.width - 32) / V.w, (r.height - 110) / V.h); V.scale = s; V.min = s * .5; V.max = Math.max(s * 12, 2.5);
  V.x = (r.width - V.w * s) / 2; V.y = Math.max(56, (r.height - V.h * s) / 2); applyT(); }
function zoomAt(f, cx, cy){ const ns = clamp(V.scale * f, V.min, V.max); V.x = cx - (cx - V.x) * (ns / V.scale); V.y = cy - (cy - V.y) * (ns / V.scale); V.scale = ns; applyT(); }
function updatePins(){
  const box = $('#pins'); if (!box) return;
  const list = S.snags.filter(s => s.plan_id === S.planId && s.x != null && (S.showClosed || s.status !== 'closed'));
  box.innerHTML = list.map(s => `<button class="pin st-${s.status} ${s.status === 'closed' ? 'dim' : ''}" style="left:${s.x * 100}%;top:${s.y * 100}%" data-act="snag" data-id="${s.id}" aria-label="Defect ${refOf(s)}"><b>${s.num}</b></button>`).join('')
    + (S.draft && S.draft.plan_id === S.planId ? `<span class="pin draft" style="left:${S.draft.x * 100}%;top:${S.draft.y * 100}%"><b>+</b></span>` : '');

function setPlacing(on){ S.placing = on; $('#fab')?.classList.toggle('on', on); const h = $('#placeHint'); if (h) h.hidden = !on; $('#viewer')?.classList.toggle('placing', on); }
function placeAt(cx, cy){
  const r = $('#viewer').getBoundingClientRect(), x = (cx - r.left - V.x) / V.scale / V.w, y = (cy - r.top - V.y) / V.scale / V.h;

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function stopDictation(){ if (rec){ try { rec.stop(); } catch {} rec = null; $$('[data-act="dictate"]').forEach(b => b.classList.remove('rec')); } }
function dictate(btn){
  if (rec){ const same = rec._target === btn.dataset.target; stopDictation(); if (same) return; }
  const el = $('#' + btn.dataset.target); if (!el) return;
  rec = new SR(); rec.lang = 'en-GB'; rec.continuous = true; rec.interimResults = true; rec._target = btn.dataset.target;
  const base = el.value ? el.value.replace(/\s*$/, ' ') : '';
  rec.onresult = e => { let t = ''; for (const r of e.results) t += r[0].transcript; el.value = base + t; autosize(el); };
  rec.onend = () => { btn.classList.remove('rec'); if (el.dataset.field && S.sheet?.id) onField(el); rec = null; };
  rec.onerror = e => { if (e.error === 'not-allowed') toast('Allow the microphone to use voice notes.'); };
  rec.start(); btn.classList.add('rec');
}

async function startMarkup(key){
  const img = await imageFor(key), cv = $('#mk'); if (!img || !cv) return;
  const base = scaleCanvas(img, 1800); cv.width = base.width; cv.height = base.height;
  const ctx = cv.getContext('2d'), shapes = []; let cur = null;
  const lw = Math.max(4, cv.width / 170);
  const drawArrow = (a, b) => { const ang = Math.atan2(b.y - a.y, b.x - a.x), h = lw * 4.5;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - h * Math.cos(ang - .45), b.y - h * Math.sin(ang - .45)); ctx.lineTo(b.x - h * Math.cos(ang + .45), b.y - h * Math.sin(ang + .45)); ctx.closePath(); ctx.fill(); };
  const redraw = () => { ctx.drawImage(base, 0, 0); ctx.lineCap = ctx.lineJoin = 'round';
    [...shapes, ...(cur ? [cur] : [])].forEach(sh => { ctx.strokeStyle = ctx.fillStyle = sh.c; ctx.lineWidth = lw;
      if (sh.t === 'pen'){ ctx.beginPath(); sh.p.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke(); }
      else if (sh.t === 'arrow' && sh.p.length > 1) drawArrow(sh.p[0], sh.p[sh.p.length - 1]);
      else if (sh.t === 'box' && sh.p.length > 1){ const a = sh.p[0], b = sh.p[sh.p.length - 1]; ctx.strokeRect(a.x, a.y, b.x - a.x, b.y - a.y); }
      else if (sh.t === 'text'){ ctx.font = `600 ${Math.round(lw * 6)}px -apple-system, Helvetica, Arial, sans-serif`; ctx.lineWidth = lw * .9; ctx.strokeStyle = sh.c === '#111111' ? '#fff' : '#000'; ctx.strokeText(sh.s, sh.p[0].x, sh.p[0].y); ctx.fillStyle = sh.c; ctx.fillText(sh.s, sh.p[0].x, sh.p[0].y); } }); };
  const pt = e => { const r = cv.getBoundingClientRect(); return { x:(e.clientX - r.left) * cv.width / r.width, y:(e.clientY - r.top) * cv.height / r.height }; };
  cv.onpointerdown = async e => {
    if (S.lb.tool === 'text'){
      const p = pt(e);
      const s = await textPrompt(); if (s){ shapes.push({ t:'text', c:S.lb.color, p:[p], s }); redraw(); } return;
    }
    cv.setPointerCapture(e.pointerId); cur = { t:S.lb.tool, c:S.lb.color, p:[pt(e)] }; redraw(); };
  cv.onpointermove = e => { if (cur){ cur.p.push(pt(e)); redraw(); } };
  cv.onpointerup = cv.onpointercancel = () => { if (cur){ shapes.push(cur); cur = null; redraw(); } };
  S.lb.mk = { canvas:cv, undo:() => { shapes.pop(); redraw(); }, has:() => shapes.length > 0 };
  redraw();
}
function textPrompt(){
  return new Promise(resolve => {
    const root = $('#dialogRoot');
    root.innerHTML = `<div class="busy" style="z-index:90"><form class="dialog" id="tp"><h3>Add a label</h3><input id="tp-in" class="cfull" style="background:var(--fill);border-radius:10px;padding:10px 12px" placeholder="e.g. Crack 300mm"><div class="row"><button type="button" class="btn sm sec" id="tp-c">Cancel</button><button class="btn sm">Add</button></div></form></div>`;

    $('#tp').onsubmit = e => { e.preventDefault(); const v = $('#tp-in').value.trim(); root.innerHTML = ''; resolve(v); };
  });
}

  $('#previewRoot').innerHTML = `<div class="preview"><header class="nav"><div class="nav-l"><button class="tbtn" data-act="close-preview">Close</button></div><div class="nav-t">${esc(title)}</div><div class="nav-r"><button class="tbtn b" data-act="print">${icon('print')}Print</button></div></header><div class="scroll">${html}</div></div>`;
}
function csv(){
  const q = v => { const s = String(v ?? ''); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const rows = [['Ref','Room','Title','Status','Priority','Trade','Responsible','Location','Drawing','Due','Overdue','Opened','Notified','Fixed','Closed','Description','Remedial method']]
    .concat(repList().map(s => [refOf(s), s.room || '', s.title, STATUS_LONG[s.status], s.priority, s.trade, partyName(s.party_id), s.location, planName(s.plan_id), s.due, isLate(s) ? 'Yes' : '', fmtDY(s.created_at), s.notified_at ? fmtDY(s.notified_at) : '', s.fixed_at ? fmtDY(s.fixed_at) : '', s.closed_at ? fmtDY(s.closed_at) : '', s.notes, s.remedy]));
  const blob = new Blob(['﻿' + rows.map(r => r.map(q).join(',')).join('\r\n')], { type:'text/csv' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${S.practice ? S.practice + ' – ' : ''}${project().name} – Defects – ${todayISO()}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function issueTo(pid){
  const p = S.parties.find(x => x.id === pid); if (!p) return;
  const list = S.snags.filter(s => s.party_id === pid && (s.status === 'open' || s.status === 'notified')).sort((a, b) => a.num - b.num);
  if (!list.length) return;
  const choice = await dialog({ title:`Issue ${list.length} defect${list.length === 1 ? '' : 's'} to ${p.name}?`, body:'Each will be marked notified today, and the notice recorded in its trail.', actions:[{ label:'Cancel', value:false }, { label:'Issue', primary:true, value:true }] });
  if (!choice) return;
  busy(`Issuing to ${p.name}`); await issue(list, p, `defects notice ${fmtDY(new Date())}`); unbusy();
  const pr = project(), due = list.map(s => s.due).filter(Boolean).sort()[0];
  const text = [`${pr.name}${pr.job ? ` (${pr.job})` : ''}`, '', `Please find attached ${list.length} defect${list.length === 1 ? '' : 's'} for your attention.`, due ? `The earliest is due by ${fmtDY(due)}.` : '',
    '', 'You can view each item, reply, add photos and mark it fixed in pin.:', `${PORTAL}#${pr.id}`, '', author(), S.practice || ''].filter((x, i, a) => x !== '' || a[i - 1] !== '').join('\n').trim();
  await copy(text);
  await buildReport(list, `Defects notice: ${p.name}`, p);
  toast('Covering message copied. Print or save the notice as PDF.', 4500);
}

async function pdfPages(file){
  await loadScript(PDFJS_W); await loadScript(PDFJS);
  const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = PDFJS_W;
  const pdf = await lib.getDocument({ data:new Uint8Array(await file.arrayBuffer()), isEvalSupported:false }).promise, out = [];
  for (let i = 1; i <= Math.min(pdf.numPages, 20); i++){
    busy(`Reading page ${i} of ${Math.min(pdf.numPages, 20)}`);
    const page = await pdf.getPage(i), v1 = page.getViewport({ scale:1 }), vp = page.getViewport({ scale:Math.min(2600 / Math.max(v1.width, v1.height), 5) });
    const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); await page.render({ canvasContext:x, viewport:vp }).promise; out.push(c);
  }
  return out;
}
async function addPlan(file){
  try {
    busy('Reading drawing');
    const pages = /pdf$/i.test(file.type) || /\.pdf$/i.test(file.name) ? await pdfPages(file) : [await fileToCanvas(file, 3200)];
    const base = file.name.replace(/\.[^.]+$/, '').replace(/_+/g, ' ');
    for (let i = 0; i < pages.length; i++){
      busy(pages.length > 1 ? `Saving drawing ${i + 1} of ${pages.length}` : 'Saving drawing');
      const c = scaleCanvas(pages[i], 3200), key = await upload(c, S.pid, 3200, .86);
      const row = { id:uuid(), project_id:S.pid, name:pages.length > 1 ? `${base} · p${i + 1}` : base, image_key:key, width:c.width, height:c.height, created_at:nowISO(), updated_at:nowISO(), removed:false };
      const { error } = await sb.from('plans').insert(row); if (error) throw error;
      if (i === 0) S.planId = row.id;
    }
    await loadProject(S.pid); S.tab = 'plans'; renderProject(); toast(pages.length > 1 ? `${pages.length} drawings added` : 'Drawing added');
  } catch (e){ fail(e, "That drawing couldn't be added. Use a PDF, JPG or PNG."); } finally { unbusy(); }
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (a === 'bg-close'){ if (e.target === t) closeSheet(); return; }
  const H = {
    'home': () => { if (S.channel) {} renderHome(); refresh(); },
    'open-project': () => openProject(t.dataset.id),
    'new-project': () => { S.sheet = { kind:'new-project' }; renderNewProject(); },
    'create-project': createProject,
    'account': () => { S.sheet = { kind:'account' }; renderAccount(); },
    'sign-out': async () => { closeSheet(); await sb.auth.signOut(); renderSignIn(); },
    'tab': () => { if (S.tab === t.dataset.tab) return; S.tab = t.dataset.tab; $$('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab)); renderTab(); },
    'plan': () => { S.planId = t.dataset.id; renderPlans(); },
    'add-plan': () => { $('#planInput').value = ''; $('#planInput').click(); },
    'place': () => setPlacing(!S.placing),
    'zoom-in': () => { const r = $('#viewer').getBoundingClientRect(); zoomAt(1.4, r.width / 2, r.height / 2); },
    'zoom-out': () => { const r = $('#viewer').getBoundingClientRect(); zoomAt(1 / 1.4, r.width / 2, r.height / 2); },
    'fit': fitView,
    'snag': () => { if (!S.placing) openSnag(t.dataset.id); },
    'new-snag': () => openNew(null),
    'close-sheet': closeSheet,
    'create-snag': createSnag,
    'set-status': async () => { await setStatus(cur(), t.dataset.s); refreshSheet(); onData(); },
    'set-prio': async () => { const s = cur(), p = t.dataset.p; if (s.priority === p) return; if (!S.sheet.id){ s.priority = p; return renderSheet(); } await saveSnag(s, { priority:p }, `Priority: ${p}`); renderSheet(); },
    'add-photo': () => { $('#photoInput').value = ''; $('#photoInput').click(); },
    'photo': () => { S.lb = { i:+t.dataset.i, color:'#FF3B30', tool:'pen' }; renderLB(); },
    'show-on-plan': () => { const s = cur(); S.planId = s.plan_id; closeSheet(); S.tab = 'plans'; renderProject(); },
    'ai-refine': () => ai('refine'), 'ai-remedy': () => ai('remedy'),
    'ai-toggle': async () => { if (aiOn()){ try { localStorage.removeItem(AI_KEY); } catch (e) {} toast('AI assist turned off'); renderAccount(); } else if (await aiConsent()){ toast('AI assist turned on'); renderAccount(); } },
    'dictate': () => dictate(t),
    'post': post, 'notify': notify, 'mark-fixed': openReply,
    'back-to-snag': () => { stopDictation(); S.sheet = { kind:'snag', id:S.sheet.id }; renderSheet(); },
    'submit-fixed': submitFixed,
    'del-snag': async () => { if (!S.sheet.delConfirm){ S.sheet.delConfirm = true; t.textContent = 'Tap Again to Delete'; return; }
      const s = cur(); await saveSnag(s, { removed:true }, 'Deleted'); S.snags = S.snags.filter(x => x.id !== s.id); closeSheet(); onData(); },
    'lb-close': () => { S.lb = null; renderLB(); },
    'lb-prev': () => { S.lb.i--; renderLB(); }, 'lb-next': () => { S.lb.i++; renderLB(); },
    'lb-markup': () => { S.lb.mk = true; renderLB(); },
    'lb-del': async () => { if (!S.lb.confirm){ S.lb.confirm = true; return renderLB(); } const s = cur(), keys = s.photo_keys.filter((_, i) => i !== S.lb.i);
      if (S.sheet.id) await saveSnag(s, { photo_keys:keys }, 'Photo removed'); else s.photo_keys = keys; S.lb = keys.length ? { i:0 } : null; renderLB(); refreshSheet(); },
    'mk-color': () => { S.lb.color = t.dataset.c; $$('.swatch').forEach(b => b.classList.toggle('on', b === t)); },

    if (id === 'pwForm'){ const a = $('#pw1').value, b = $('#pw2').value; if (a.length < 8) return toast('Use at least 8 characters'); if (a !== b) return toast("The passwords don't match");

  const el = e.target, id = el.id;

    if (id === 'photoInput') return addPhotos([...el.files]);

    if (id === 'acc-name'){ S.me.name = el.value.trim(); await sb.from('profiles').update({ name:S.me.name }).eq('user_id', S.me.id); return toast('Saved'); }
    if (id === 'fParty'){ S.f.party = el.value; return renderSnagList(); }
    if (id === 'rParty'){ S.rep.party = el.value; return renderReportPreview(); }
    if (id === 'rTrade'){ S.rep.trade = el.value; return renderReportPreview(); }
    if (id === 'rPhotos') S.rep.photos = el.checked;
    if (id === 'rDrawings') S.rep.drawings = el.checked;
    if (id === 'rTrail') S.rep.trail = el.checked;

document.addEventListener('input', e => {
  if (e.target.id === 'q'){ S.f.q = e.target.value; renderSnagList(); }
  if (e.target.tagName === 'TEXTAREA') autosize(e.target);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if ($('#previewRoot').innerHTML){ $('#previewRoot').innerHTML = ''; } else if (S.lb){ S.lb = null; renderLB(); } else if (S.sheet) closeSheet(); else if (S.placing) setPlacing(false); }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.id === 'f-note'){ e.preventDefault(); post(); }
});
window.addEventListener('resize', () => { clearTimeout(window._rz); window._rz = setTimeout(() => { if ($('#viewer')) fitView(); }, 150); });
boot();
